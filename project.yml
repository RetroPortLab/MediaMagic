name: ShelfLife
options:
  bundleIdPrefix: uk.shelflife
  deploymentTarget:
    iOS: "17.0"
targets:
  ShelfLife:
    type: application
    platform: iOS
    sources: [ShelfLife]
    scheme: {}            # shared scheme so xcodebuild / Codemagic can build it
    settings:
      base:
        # Change this to something unique to you before signing (e.g. uk.yourname.shelflife).
        PRODUCT_BUNDLE_IDENTIFIER: uk.shelflife.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ShelfLife
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to photograph covers and scan barcodes. Photos stay on this iPhone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.0"
